services:
  api:
    build: .
    ports:
      - "0.0.0.0:${API_PORT:-8011}:8011"
    environment:
      MODEL_NAME: "${MODEL_NAME:-${QWEN_MODEL_NAME:-qwen3.8-27b-fp8}}"
      VLLM_BASE_URL: "http://host.docker.internal:${VLLM_PORT:-${QWEN_VLLM_PORT:-8010}}/v1"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
    volumes:
      - ./runtime:/app/runtime:ro
